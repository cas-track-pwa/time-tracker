name = "time-tracker"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# JWT_SECRET should be set via wrangler secret put JWT_SECRET
# Run: npx wrangler secret put JWT_SECRET

# KV namespaces
[[kv_namespaces]]
binding = "TIME_TRACKER_KV"
id = "5fe095687b3e47778649586256073f69"

[[kv_namespaces]]
binding = "ASSETS"
id = "d7d5bf8468034151be4ef64b4862a876"

# D1 database configuration
[[d1_databases]]
binding = "DB"
database_name = "time-tracker"
database_id = "55a0bff8-e371-477c-867d-d8b38cac4066"

[wrangler]
account_id = "ebf143a278b2c6796d9102d21a378e7a"
zone_id = "your-zone-id"
workers_dev = true

# For local development
[dev]
port = 8787
ip = "127.0.0.1"

[triggers]
crons = []