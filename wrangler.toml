name = "time-tracker"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# JWT_SECRET is required for signing auth tokens.
# Set it via: npx wrangler secret put JWT_SECRET
# For local dev, create a .dev.vars file with: JWT_SECRET="your-secret-here"

# Fallback allowed users for local development
# Update this with your actual emails
FALLBACK_ALLOWED_USERS = '["user1@example.com", "user2@example.com"]'

# CORS: restrict to your production domain in production.
# Set via: npx wrangler secret put ALLOWED_ORIGIN
# For local dev, leave unset to allow all origins ('*')
# ALLOWED_ORIGIN = "https://your-domain.com"

# KV namespaces
[[kv_namespaces]]
binding = "TIME_TRACKER_KV"
id = "5fe095687b3e47778649586256073f69"

# Static assets - automatically uploaded by `wrangler deploy`
[assets]
directory = "."
binding = "ASSETS"
# Exclude files that shouldn't be served as static assets
exclude = [
  "node_modules",
  ".wrangler",
  ".dev.vars",
  ".gitignore",
  "AGENTS.md",
  "CLOUDFLARE_MIGRATION.md",
  "upload-assets.ps1",
  "package.json",
  "package-lock.json",
  "wrangler.toml",
  "migrations",
  "manifest.webapp",
]

# D1 database configuration
[[d1_databases]]
binding = "DB"
database_name = "time-tracker"
database_id = "55a0bff8-e371-477c-867d-d8b38cac4066"

# For local development
[dev]
port = 8787
ip = "127.0.0.1"

# Upload static assets automatically during deploy
# The [assets] binding above handles this — no manual KV upload needed.
